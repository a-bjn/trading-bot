[package]
name = "solana-trading-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
# Solana dependencies
solana-client = "1.18"
solana-sdk = "1.18"
solana-transaction-status = "1.18"
solana-account-decoder = "1.18"

# Anchor dependencies
anchor-lang = "0.29"
anchor-spl = "0.29"
spl-token = "4.0"
spl-associated-token-account = "2.3"

# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-tungstenite = "0.21"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "chrono"] }
tracing-appender = "0.2"

# Telegram bot (using reqwest directly for simple API calls)
# teloxide = { version = "0.12", features = ["macros"] }

# Encoding
bs58 = "0.5"
base64 = "0.21"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Configuration
config = "0.14"
dotenv = "0.15"

# Time handling
chrono = "0.4"

# Additional utilities
futures = "0.3"
async-trait = "0.1"
rand = "0.8"
bincode = "1.3"
borsh = "0.10"
tokio-stream = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
